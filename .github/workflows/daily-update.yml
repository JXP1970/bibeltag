name: Täglicher Bibeltag-Update

on:
  schedule:
    # Krumme Minuten: zur vollen Stunde ist GitHubs Warteschlange am vollsten,
    # dann fallen geplante Läufe oft aus oder verspäten sich stark.
    # 02:23 UTC = 04:23 (Sommer) / 03:23 (Winter) Berliner Zeit
    - cron: "23 2 * * *"
    # Sicherheitsnetz, falls der erste Lauf ausfällt: 04:47 UTC
    - cron: "47 4 * * *"
  workflow_dispatch: {}  # erlaubt manuelles Auslösen

permissions:
  contents: write

concurrency:
  group: bibeltag-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install "anthropic>=0.40" playwright
          playwright install --with-deps chromium

      - name: Tagesdaten erzeugen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BIBELTAG_MODEL: claude-sonnet-5
        run: python scripts/generate_data.py

      - name: Änderungen committen & pushen
        run: |
          git config user.name "Bibeltag Bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain index.html)" ]; then
            git add index.html
            git commit -m "Bibeltag: Daten für $(TZ=Europe/Berlin date +%Y-%m-%d)"
            git push
          else
            echo "Keine Änderung – nichts zu committen."
          fi
